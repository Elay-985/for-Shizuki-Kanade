<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>给詩月 奏的礼物</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}
#canvas{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  display:block;
}
.msg{
  position:fixed;
  top:50%;
  left:50%;
  transform: translate(-50%,-50%);
  z-index:3;
  color:#FFF8DE; /*月亮淡黄色*/
  font-family:"Microsoft YaHei", serif;
  font-size:clamp(19px,5vw,28px); /*留言字体放大*/
  line-height:2.2;
  text-align:center;
  pointer-events:none;
  opacity:0;
  text-shadow:0 0 16px rgba(255,248,222,0.55);
  width:92%;
}
.msg.show{
  animation: fadeIn 2.5s ease-in forwards;
}
@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}
.tip{
  position:fixed;
  top:50%;
  left:50%;
  transform: translate(-50%,-50%);
  z-index:3;
  color:#cfd6e4;
  font-family:"Microsoft YaHei", serif;
  font-size:clamp(15px,3.5vw,20px);
  text-align:center;
  letter-spacing:1px;
  text-shadow:0 0 12px rgba(255,255,255,0.35);
  width:92%;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="tip">🏮您有一条留言，请点击查看🏮</div>
<div class="msg">
<br>老师，这是给你的小礼物。
<p>很开心认识老师你呢。<br>
  看到你的空间说“想快点过下一个夏天”<br>
  然后我顺便听了一下白幻花，挺好听的<br>
  感觉你可能想参加烟火大会，看看烟花<br>
  我能做的不多，只能写个小页面，希望能看到会好点<br>
  刚刚学代码，有点简陋，见谅(傻笑)<br>
  最后，希望生活不薄于你。
</div>
<script>
window.onload = function(){
  let clicked = false;
  let bgMusic = null;
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  let width, height;
  function resizeCanvas(){
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
  }
  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const isDesktop = !isMobile;
  class Star {
    constructor(){
      this.reset();
    }
    reset(){
      this.x = Math.random() * width;
      this.y = Math.random() * height;
      this.radius = Math.random() * (isDesktop ? 2.2 : 1.6) + (isDesktop ? 1.1 : 0.8);
      this.phase = Math.random() * Math.PI * 2;
      this.speed = 0.015 + Math.random() * 0.02;
    }
    update(){
      this.phase += this.speed;
      this.bright = 0.35 + 0.65 * Math.sin(this.phase);
    }
    draw(){
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${this.bright})`;
      ctx.fill();
    }
  }
  let stars = [];
  function createStars(){
    stars = [];
    const count = isMobile ? 40 : 110;
    for(let i=0;i<count;i++) stars.push(new Star());
  }
  createStars();
  const fireworks = [];
  const particles = [];
  class Firework{
    constructor(){
      this.x = Math.random() * width;
      this.targetX = Math.random() * width;
      this.targetY = Math.random() * height * 0.45;
      this.y = height;
      this.speed = isDesktop ? 4.2 : 3;
      this.angle = Math.atan2(this.targetY - this.y, this.targetX - this.x);
      this.hue = Math.random()*360;
    }
    update(){
      this.x += Math.cos(this.angle)*this.speed;
      this.y += Math.sin(this.angle)*this.speed;
      const dist = Math.hypot(this.x - this.targetX, this.y - this.targetY);
      if(dist < 10){
        explode(this.targetX, this.targetY, this.hue);
        return false;
      }
      return true;
    }
    draw(){
      ctx.beginPath();
      ctx.arc(this.x,this.y, isDesktop ? 2.8 : 2, 0, Math.PI*2);
      ctx.fillStyle=`hsl(${this.hue},100%,70%)`;
      ctx.fill();
    }
  }
  class Particle{
    constructor(x,y,hue){
      this.x=x;this.y=y;this.hue=hue;
      const ang = Math.random()*Math.PI*2;
      const spd = Math.random()*(isDesktop ? 4.2 : 3) + 1;
      this.vx = Math.cos(ang)*spd;
      this.vy = Math.sin(ang)*spd;
      this.life = isDesktop ? 110 : 80;
      this.maxLife = this.life;
      this.size = isDesktop ? 2.2 : 1.8;
    }
    update(){
      this.vy += 0.04;
      this.x += this.vx;
      this.y += this.vy;
      this.life--;
      return this.life>0;
    }
    draw(){
      ctx.beginPath();
      ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
      ctx.fillStyle=`hsla(${this.hue},100%,70%,${this.life / this.maxLife})`;
      ctx.fill();
    }
  }
  function explode(x,y,hue){
    const cnt = isMobile ? 50 : 120;
    for(let i=0;i<cnt;i++) particles.push(new Particle(x,y,hue));
  }
  function spawnFirework(){
    fireworks.push(new Firework());
  }
  setInterval(spawnFirework, isMobile ? 1800 : 900);
  function animate(){
    const grad = ctx.createLinearGradient(0,0,0,height);
    grad.addColorStop(0,"#020310");
    grad.addColorStop(0.5,"#0b1b42");
    grad.addColorStop(1,"#203b70");
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,width,height);
    for(let s of stars){ s.update(); s.draw(); }
    for(let i=fireworks.length-1;i>=0;i--){
      fireworks[i].draw();
      if(!fireworks[i].update()) fireworks.splice(i,1);
    }
    for(let i=particles.length-1;i>=0;i--){
      particles[i].draw();
      if(!particles[i].update()) particles.splice(i,1);
    }
    requestAnimationFrame(animate);
  }
  animate();
  const msgBox = document.querySelector('.msg');
  const tipBox = document.querySelector('.tip');
  function handleClick(){
    if(clicked) return;
    clicked=true;
    tipBox.style.display="none";
    msgBox.classList.add("show");
    // ==========歌曲文件名在这里==========
    if(!bgMusic){
      bgMusic = new Audio("music.mp3");
      bgMusic.loop = true;
      bgMusic.volume = 0.6;
    }
    bgMusic.play().catch(err=>{
      console.log("音乐播放失败：确认mp3放在同文件夹，不要ncm格式", err);
    });
  }
  document.body.addEventListener('click',handleClick);
  document.body.addEventListener('touchstart',handleClick,{passive:true});
}
</script>
</body>
</html>
